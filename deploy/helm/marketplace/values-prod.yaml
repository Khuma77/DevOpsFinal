# Production environment values
replicaCount: 3

image:
  tag: "prod"

ingress:
  hosts:
    - host: marketplace.company.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10

env:
  - name: ENVIRONMENT
    value: "production"
  - name: LOG_LEVEL
    value: "INFO"

# Production-specific monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 15s