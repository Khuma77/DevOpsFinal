# Development environment values
replicaCount: 1

image:
  tag: "fe2b8f9d9ddcf5976d13edce64eed28fbecf7dce"

ingress:
  hosts:
    - host: marketplace-dev.company.com
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false

env:
  - name: ENVIRONMENT
    value: "development"
  - name: LOG_LEVEL
    value: "DEBUG"