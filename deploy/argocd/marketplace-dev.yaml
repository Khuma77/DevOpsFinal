apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: marketplace-dev
  namespace: argocd
  labels:
    app: marketplace
    environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/marketplace.git
    targetRevision: HEAD
    path: deploy/helm/marketplace
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: marketplace-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10