# promtail-config.yml - Promtail configuration for log shipping
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Marketplace application logs (JSON format)
  - job_name: marketplace-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: marketplace-app
          __path__: /app/logs/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            event_type: event_type
            message: event
      - timestamp:
          source: timestamp
          format: RFC3339
      - labels:
          level:
          event_type:

  # System logs (if needed)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log