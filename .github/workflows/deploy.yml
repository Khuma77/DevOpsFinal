name: FastAPI Marketplace CI/CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select environment"
        type: choice
        required: true
        options: [ dev, staging, prod ]
        default: dev
      deploy:
        description: "Deploy after build?"
        type: boolean
        required: true
        default: false
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  security-events: write

jobs:
  # -------------------------------------------------------
  # 1️⃣ BUILD + TEST + DOCKER BUILD & PUSH
  # -------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------- Python Setup --------
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (basic syntax check)
        run: |
          python -m py_compile main.py
          python -m py_compile sheets.py
          python -m py_compile metrics.py
          python -m py_compile logging_config.py

      # -------- Docker Setup --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # -------- Build & Push --------
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/marketplace-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------- GitOps: Helm values update --------
      - name: Update Helm image tags
        if: ${{ github.event.inputs.deploy == 'true' || github.ref == 'refs/heads/main' }}
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          # Extract just the SHA tag for GitOps
          IMAGE_TAG="${{ github.sha }}"
          
          # Update the appropriate values file based on environment
          if [ "$ENVIRONMENT" = "dev" ]; then
            sed -i "s/tag:.*/tag: \"$IMAGE_TAG\"/" deploy/helm/marketplace/values-dev.yaml
          elif [ "$ENVIRONMENT" = "staging" ]; then
            sed -i "s/tag:.*/tag: \"$IMAGE_TAG\"/" deploy/helm/marketplace/values-staging.yaml
          elif [ "$ENVIRONMENT" = "prod" ]; then
            sed -i "s/tag:.*/tag: \"$IMAGE_TAG\"/" deploy/helm/marketplace/values-prod.yaml
          fi

      - name: Commit Helm changes
        if: ${{ github.event.inputs.deploy == 'true' || github.ref == 'refs/heads/main' }}
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add deploy/helm/marketplace/values-*.yaml
          git commit -m "chore: update $ENVIRONMENT image tag to ${{ github.sha }}" || exit 0
          git push

  # -------------------------------------------------------
  # 2️⃣ TRIVY SECURITY SCAN
  # -------------------------------------------------------
  trivy-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: '${{ secrets.DOCKER_HUB_USERNAME }}/marketplace-app:${{ github.sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'  # Don't fail the build on vulnerabilities

  # -------------------------------------------------------
  # 3️⃣ DEPLOY NOTIFICATION (ArgoCD will handle actual deployment)
  # -------------------------------------------------------
  deploy-notification:
    runs-on: ubuntu-latest
    needs: [build, trivy-scan]
    if: ${{ github.event.inputs.deploy == 'true' || github.ref == 'refs/heads/main' }}
    
    steps:
      - name: Deployment notification
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🚀 Deployment triggered for environment: $ENVIRONMENT"
          echo "📦 Image tag: $IMAGE_TAG"
          echo "🔄 ArgoCD will automatically sync the changes"
          echo ""
          echo "Monitor deployment at:"
          echo "- ArgoCD UI: https://argocd.company.com"
          echo "- Application: https://marketplace-$ENVIRONMENT.company.com"
          echo ""
          echo "Helm values updated in:"
          echo "- deploy/helm/marketplace/values-$ENVIRONMENT.yaml"