# prometheus.yml - Prometheus configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI Marketplace application
  - job_name: 'marketplace-app'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Windows/Mac Docker Desktop
        # - targets: ['172.17.0.1:8000']  # Linux Docker
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s